<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunbot Growth Portal v5.6 Quote PDF Clean</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    :root {
      --orange-900:#7c2d12;
      --orange-800:#9a3412;
      --orange-700:#c2410c;
      --orange-600:#ea580c;
      --orange-500:#f97316;
      --orange-400:#fb923c;
      --orange-300:#fdba74;
      --orange-200:#fed7aa;
      --orange-100:#ffedd5;
      --orange-50:#fff7ed;
      --slate-900:#0f172a;
      --slate-800:#1e293b;
      --slate-700:#334155;
      --slate-600:#475569;
      --slate-500:#64748b;
      --slate-400:#94a3b8;
      --slate-200:#e2e8f0;
      --slate-100:#f1f5f9;
      --white:#ffffff;
      --green:#047857;
      --red:#dc2626;
      --amber:#b45309;
      --radius:22px;
      --shadow:0 18px 42px -32px rgba(124,45,18,.42);
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      font-family:Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--slate-700);
      background:
        radial-gradient(circle at top left, rgba(251,146,60,.22), transparent 34rem),
        linear-gradient(180deg, var(--orange-50), #fff 38%, var(--orange-50));
      min-height:100vh;
    }

    button, input, select, textarea { font:inherit; }
    button { cursor:pointer; }
    a { color:inherit; text-decoration:none; }

    .hidden { display:none !important; }
    .app-shell { min-height:100vh; }
    .container { width:min(1240px, calc(100% - 32px)); margin:0 auto; }

    .login-wrap {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .login-card {
      width:min(440px, 100%);
      background:rgba(255,255,255,.92);
      border:1px solid var(--orange-200);
      border-radius:30px;
      box-shadow:var(--shadow);
      padding:30px;
    }

    .sun-icon img { width:100%; height:100%; object-fit:contain; display:block; }
    .sun-icon {
      width:64px;height:64px;
      margin:0 auto;
      border-radius:22px;
      background:linear-gradient(135deg,var(--orange-100),var(--orange-300));
      display:flex;align-items:center;justify-content:center;
      font-size:38px;
    }

    .title { margin:16px 0 0; font-size:30px; line-height:1.05; font-weight:900; color:var(--slate-700); text-align:center; }
    .subtitle { margin:9px 0 0; font-size:14px; color:var(--slate-500); text-align:center; line-height:1.55; }

    .field { display:flex; flex-direction:column; gap:7px; margin-top:16px; }
    .label { font-size:13px; font-weight:800; color:var(--slate-600); }
    .input, .select, .textarea {
      width:100%;
      border:1px solid var(--orange-200);
      background:rgba(255,247,237,.45);
      color:var(--slate-700);
      border-radius:16px;
      padding:13px 14px;
      outline:none;
      transition:border .15s, box-shadow .15s, background .15s;
    }
    .input:focus, .select:focus, .textarea:focus {
      border-color:var(--orange-400);
      box-shadow:0 0 0 4px rgba(249,115,22,.12);
      background:white;
    }

    .btn {
      border:1px solid transparent;
      border-radius:16px;
      padding:12px 15px;
      font-weight:850;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      transition:background .15s, border .15s, color .15s, transform .1s, opacity .15s;
      white-space:nowrap;
    }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .btn:active { transform:translateY(1px); }
    .btn-primary {
      background:var(--orange-500);
      border-color:var(--orange-600);
      color:white;
      box-shadow:0 10px 18px -14px rgba(234,88,12,.8);
    }
    .btn-primary:hover { background:var(--orange-600); }
    .btn-soft {
      background:var(--orange-50);
      border-color:var(--orange-200);
      color:var(--orange-800);
    }
    .btn-soft:hover { background:var(--orange-100); border-color:var(--orange-300); }
    .btn-white {
      background:white;
      border-color:var(--orange-200);
      color:var(--orange-800);
    }
    .btn-white:hover { background:var(--orange-50); }
    .btn-muted {
      background:var(--slate-100);
      border-color:var(--slate-200);
      color:var(--slate-700);
    }

    .notice {
      border:1px solid var(--orange-200);
      background:var(--orange-50);
      color:var(--slate-600);
      border-radius:18px;
      padding:14px;
      font-size:13px;
      line-height:1.55;
      margin-top:18px;
    }
    .msg { margin-top:12px; font-size:13px; font-weight:800; text-align:center; }
    .msg.error { color:var(--red); }
    .msg.ok { color:var(--green); }

    .topbar {
      position:sticky; top:0; z-index:30;
      background:rgba(255,255,255,.9);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--orange-100);
    }
    .top-main {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:18px;
      padding:16px 0 10px;
    }
    .kicker {
      font-size:11px;
      font-weight:900;
      letter-spacing:.16em;
      color:var(--orange-600);
      text-transform:uppercase;
      margin:0 0 7px;
    }
    .app-title {
      margin:0;
      font-size:26px;
      line-height:1.12;
      color:var(--slate-700);
      font-weight:900;
    }
    .user-line { margin:7px 0 0; color:var(--slate-500); font-size:13px; line-height:1.45; }

    .top-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .nav {
      display:flex; gap:8px; overflow-x:auto; padding:0 0 14px;
      scrollbar-width:thin;
    }
    .nav-btn {
      background:white;
      color:var(--orange-800);
      border:1px solid var(--orange-200);
      border-radius:16px;
      padding:11px 14px;
      font-weight:850;
      white-space:nowrap;
    }
    .nav-btn:hover { background:var(--orange-50); }
    .nav-btn.active {
      background:var(--orange-500);
      color:white;
      border-color:var(--orange-600);
    }

    main { padding:18px 0 34px; }
    .screen { display:none; }
    .screen.active { display:block; }

    .card {
      background:rgba(255,255,255,.94);
      border:1px solid var(--orange-200);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:20px;
    }
    .soft-card {
      background:var(--orange-50);
      border:1px solid var(--orange-200);
      border-radius:18px;
      padding:15px;
    }
    .section-label {
      display:inline-flex; align-items:center; gap:6px;
      font-size:11px; font-weight:900; letter-spacing:.1em; text-transform:uppercase;
      color:var(--orange-600);
      background:var(--orange-50);
      border:1px solid var(--orange-200);
      border-radius:999px;
      padding:6px 10px;
    }
    .h2 { margin:12px 0 0; font-size:23px; line-height:1.2; font-weight:900; color:var(--slate-700); }
    .h3 { margin:0; font-size:17px; font-weight:900; color:var(--slate-700); }
    .p { margin:9px 0 0; color:var(--slate-500); font-size:14px; line-height:1.65; }
    .grid { display:grid; gap:14px; }
    .grid-2 { grid-template-columns:repeat(2, minmax(0,1fr)); }
    .grid-3 { grid-template-columns:repeat(3, minmax(0,1fr)); }
    .grid-4 { grid-template-columns:repeat(4, minmax(0,1fr)); }

    .stat {
      padding:16px;
      border:1px solid var(--orange-100);
      background:white;
      border-radius:18px;
    }
    .stat-label { margin:0; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--slate-400); font-weight:900; }
    .stat-val { margin:8px 0 0; font-size:29px; font-weight:900; color:var(--slate-700); }
    .stat-note { margin:6px 0 0; font-size:12px; color:var(--slate-500); line-height:1.45; }

    .quick-action {
      text-align:left;
      background:white;
      border:1px solid var(--orange-200);
      border-radius:20px;
      padding:18px;
      min-height:126px;
      transition:background .15s, transform .1s;
    }
    .quick-action:hover { background:var(--orange-50); transform:translateY(-1px); }
    .quick-action h3 { margin:0; color:var(--slate-700); font-size:17px; font-weight:900; }
    .quick-action p { margin:8px 0 0; color:var(--slate-500); font-size:13px; line-height:1.55; }

    .toolbar {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
      margin-bottom:14px;
    }
    .toolbar .input { flex:1; min-width:220px; }
    .toolbar .select { width:auto; min-width:220px; }

    .pack {
      margin-bottom:16px;
    }
    .pack-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:14px;
      margin-bottom:14px;
    }
    .pill {
      display:inline-flex;
      align-items:center;
      gap:6px;
      border-radius:999px;
      background:var(--orange-50);
      border:1px solid var(--orange-200);
      color:var(--orange-800);
      padding:5px 10px;
      font-size:12px;
      font-weight:850;
    }
    .doc-card {
      border:1px solid var(--orange-100);
      background:white;
      border-radius:20px;
      padding:16px;
    }
    .doc-title { margin:10px 0 0; color:var(--slate-700); font-weight:900; font-size:15px; line-height:1.35; }
    .doc-desc { margin:8px 0 0; color:var(--slate-500); font-size:13px; line-height:1.55; }
    .doc-meta { margin-top:10px; color:var(--slate-500); font-size:12px; line-height:1.5; }
    .doc-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:13px; }

    .table-wrap { overflow:auto; border:1px solid var(--orange-100); border-radius:18px; }
    table { width:100%; border-collapse:collapse; min-width:900px; background:white; }
    th, td { padding:12px; border-bottom:1px solid var(--orange-50); text-align:left; vertical-align:top; font-size:13px; }
    th { background:var(--orange-50); color:var(--orange-800); font-size:11px; text-transform:uppercase; letter-spacing:.07em; }
    tr:last-child td { border-bottom:0; }

    .status {
      display:inline-flex;
      border-radius:999px;
      padding:4px 9px;
      font-size:12px;
      font-weight:850;
    }
    .status.active { background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; }
    .status.locked { background:#f1f5f9; color:#475569; border:1px solid #cbd5e1; }
    .status.warn { background:#fffbeb; color:#b45309; border:1px solid #fde68a; }

    .modal {
      position:fixed;
      inset:0;
      z-index:80;
      background:rgba(15,23,42,.76);
      padding:14px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .modal-card {
      width:min(620px,100%);
      max-height:calc(100vh - 28px);
      overflow:auto;
      background:white;
      border-radius:26px;
      border:1px solid var(--orange-200);
      box-shadow:0 30px 60px -30px rgba(15,23,42,.65);
      padding:20px;
    }
    .modal-wide {
      width:min(1100px,100%);
      height:calc(100vh - 28px);
      padding:0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .modal-head {
      display:flex; justify-content:space-between; gap:12px; align-items:center;
      padding:12px 14px; border-bottom:1px solid var(--orange-100);
    }
    .frame-wrap { flex:1; min-height:0; }
    iframe { border:0; width:100%; height:100%; background:white; }

    .empty {
      text-align:center;
      padding:28px;
      color:var(--slate-500);
      border:1px dashed var(--orange-200);
      border-radius:20px;
      background:var(--orange-50);
    }

    @media (max-width:900px) {
      .top-main { flex-direction:column; }
      .top-actions { justify-content:flex-start; }
      .grid-2,.grid-3,.grid-4 { grid-template-columns:1fr; }
      .toolbar { flex-direction:column; align-items:stretch; }
      .toolbar .select { width:100%; }
      .pack-head { flex-direction:column; }
      .app-title { font-size:22px; }
    }
  </style>
</head>

<body>
  <div id="loginScreen" class="login-wrap">
    <div class="login-card">
      <div class="sun-icon"><img src="https://static.sunbot.vn/static/images/lesson/11461/logo-sunbot-1.png" alt="Sunbot logo" /></div>
      <h1 class="title">Sunbot Growth Portal</h1>
      <p class="subtitle">Không gian tài liệu, cơ hội và đối tác của Sunbot</p>

      <div class="field">
        <label class="label">Email/ID đăng nhập</label>
        <input id="loginId" class="input" placeholder="Nhập email hoặc ID được cấp" autocomplete="username" />
      </div>
      <div class="field">
        <label class="label">Mã PIN</label>
        <input id="loginPin" class="input" placeholder="Nhập mã PIN" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter') login()" />
      </div>

      <button id="loginBtn" class="btn btn-primary" style="width:100%; margin-top:18px;" onclick="login()">Đăng nhập</button>
      <div id="loginMsg" class="msg"></div>

      <div class="notice">
        Nhập Email/ID và Mã PIN được Sunbot cấp riêng. Tài khoản dùng riêng để hệ thống ghi nhận đúng hoạt động.
      </div>
    </div>
  </div>

  <div id="app" class="app-shell hidden">
    <header class="topbar">
      <div class="container">
        <div class="top-main">
          <div style="display:flex; gap:12px; align-items:flex-start;">
            <img src="https://static.sunbot.vn/static/images/lesson/11461/logo-sunbot-1.png" alt="Sunbot logo" style="width:46px;height:46px;object-fit:contain;border-radius:14px;background:var(--orange-50);border:1px solid var(--orange-200);padding:5px;" />
            <div>
              <p id="kicker" class="kicker">SUNBOT</p>
              <h1 id="appTitle" class="app-title">Sunbot Growth Portal</h1>
              <p id="userLine" class="user-line"></p>
            </div>
          </div>
          <div class="top-actions">
            <button id="backBtn" class="btn btn-white hidden" onclick="goBack()">Quay lại</button>
            <button class="btn btn-soft" onclick="refreshData(true)">Cập nhật dữ liệu</button>
            <button class="btn btn-muted" onclick="logout()">Đăng xuất</button>
          </div>
        </div>
        <nav id="nav" class="nav"></nav>
      </div>
    </header>

    <main class="container">
      <section id="screen-home" class="screen active"></section>
      <section id="screen-users" class="screen"></section>
      <section id="screen-library" class="screen"></section>
      <section id="screen-pricebook" class="screen"></section>
      <section id="screen-create" class="screen"></section>
      <section id="screen-accounts" class="screen"></section>
      <section id="screen-sent" class="screen"></section>
      <section id="screen-activity" class="screen"></section>
      <section id="screen-quote" class="screen"></section>
    </main>
  </div>

  <div id="previewModal" class="modal hidden">
    <div class="modal-card modal-wide">
      <div class="modal-head">
        <div style="min-width:0;">
          <div id="previewTitle" class="h3" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
          <div id="previewUrl" class="doc-meta" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
        </div>
        <div style="display:flex; gap:8px;">
          <a id="previewOpen" class="btn btn-soft" target="_blank">Mở tab mới</a>
          <button class="btn btn-muted" onclick="closePreview()">Đóng</button>
        </div>
      </div>
      <div class="frame-wrap">
        <iframe id="previewFrame"></iframe>
      </div>
    </div>
  </div>

  <div id="sendModal" class="modal hidden">
    <div class="modal-card">
      <div class="section-label">Ghi nhận lịch sử</div>
      <h2 class="h2">Tôi đã gửi tài liệu này cho...</h2>
      <p id="sendDocTitle" class="p"></p>
      <input id="sendContentId" type="hidden" />

      <div class="field">
        <label class="label">Người/đơn vị nhận</label>
        <select id="sendAccount" class="select"></select>
      </div>
      <div class="field">
        <label class="label">Kênh gửi</label>
        <select id="sendChannel" class="select">
          <option>Zalo</option>
          <option>Email</option>
          <option>Gặp trực tiếp</option>
          <option>Cuộc họp</option>
          <option>Điện thoại</option>
          <option>Khác</option>
        </select>
      </div>
      <div class="field">
        <label class="label">Khách phản hồi thế nào?</label>
        <textarea id="sendResponse" class="textarea" rows="2"></textarea>
      </div>
      <div class="field">
        <label class="label">Bước tiếp theo là gì?</label>
        <input id="sendNext" class="input" />
      </div>

      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:18px;">
        <button class="btn btn-white" onclick="closeSend()">Hủy</button>
        <button class="btn btn-primary" onclick="submitSendLog()">Lưu lịch sử gửi</button>
      </div>
      <div id="sendMsg" class="msg"></div>
    </div>
  </div>

<script>
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbzC6FL-fyyVvW3TTdcOoxEK-_61ZvOkxFH9ESJ1hMPeLT5gnTilw1GHYy2JZ24AJARu/exec";
const state = {
  token: localStorage.getItem("sb_v5_token") || "",
  user: JSON.parse(localStorage.getItem("sb_v5_user") || "null"),
  permissions: JSON.parse(localStorage.getItem("sb_v5_permissions") || "{}"),
  roleKind: "guest",
  current: "home",
  history: [],
  loading: false,
  dataLoaded: false,
  userAdminLoaded: false,
  userAdminError: "",
  data: {
    content: [],
    accounts: [],
    sentLogs: [],
    users: [],
    credentials: [],
    dashboard: null,
    releaseNotes: []
  }
};

function byId(id) { return document.getElementById(id); }
function esc(v) {
  return String(v ?? "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
}
function attr(v) { return esc(v).replace(/'/g,"&#39;"); }
function setText(id, text) { const el = byId(id); if (el) el.textContent = text; }
function setMsg(id, text, kind) {
  const el = byId(id);
  if (!el) return;
  el.textContent = text || "";
  el.className = "msg " + (kind || "");
}

async function api(payload) {
  const res = await fetch(BACKEND_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch(e) { throw new Error(text || "Không đọc được phản hồi hệ thống"); }
}

async function login() {
  const username = byId("loginId").value.trim();
  const password = byId("loginPin").value.trim();
  if (!username || !password) {
    setMsg("loginMsg", "Cần nhập Email/ID và Mã PIN.", "error");
    return;
  }

  byId("loginBtn").disabled = true;
  setMsg("loginMsg", "Đang đăng nhập...", "");

  try {
    const r = await api({ action:"login", username, password });
    if (!r.success) throw new Error(r.message || "Không đăng nhập được");

    state.token = r.token;
    state.user = r.user;
    state.permissions = r.permissions || {};
    localStorage.setItem("sb_v5_token", state.token);
    localStorage.setItem("sb_v5_user", JSON.stringify(state.user));
    localStorage.setItem("sb_v5_permissions", JSON.stringify(state.permissions));

    showApp();
    await refreshData(true);
  } catch(e) {
    setMsg("loginMsg", e.message, "error");
  } finally {
    byId("loginBtn").disabled = false;
  }
}

function logout() {
  localStorage.removeItem("sb_v5_token");
  localStorage.removeItem("sb_v5_user");
  localStorage.removeItem("sb_v5_permissions");
  location.reload();
}

function getRoleKind() {
  const g = String(state.user?.PermissionGroupID || "").toUpperCase();
  const r = String(state.user?.Role || "").toUpperCase();
  if (g.includes("CEO") || r.includes("CEO") || r.includes("ADMIN")) return "admin";
  if (g.includes("BOARD")) return "board";
  if (g.includes("STAFF") || g.includes("SALES")) return "staff";
  if (g.includes("CONTRACTOR") || g.includes("LAB") || g.includes("EXPERIENCE") || g.includes("FRANCHISE")) return "project";
  if (g.includes("REFERRAL") || g.includes("INVESTOR") || g.includes("PARTNER")) return "referral";
  return "referral";
}

function roleConfig() {
  const kind = state.roleKind;
  if (kind === "admin") return {
    kicker:"BẢNG ĐIỀU HÀNH SUNBOT",
    title:"Sunbot Growth OS",
    intro:"Theo dõi tài khoản, tài liệu, khách/cơ hội và lịch sử gửi thông tin.",
    tabs:[
      ["home","Tổng quan"],
      ["users","Tài khoản & phân quyền"],
      ["library","Tài liệu Sunbot"],
      ["pricebook","Bảng giá"],
["quote","Tạo báo giá"],
      ["create","Thêm khách/cơ hội"],
      ["accounts","Khách hàng & cơ hội"],
      ["sent","Lịch sử gửi"],
      ["activity","Theo dõi hoạt động"]
    ]
  };
  if (kind === "board") return {
    kicker:"GÓC NHÌN CHIẾN LƯỢC",
    title:"Sunbot Strategic View",

function showApp() {
  state.roleKind = getRoleKind();
  const cfg = roleConfig();
  byId("loginScreen").classList.add("hidden");
  byId("app").classList.remove("hidden");
  setText("kicker", cfg.kicker);
  setText("appTitle", cfg.title);
  setText("userLine", `${state.user?.FullName || state.user?.Username || ""} · ${cfg.intro}`);

  renderNav(cfg.tabs);
  goTo("home", true);
}

function renderNav(tabs) {
  byId("nav").innerHTML = tabs.map(([id, label]) =>
    `<button class="nav-btn" data-tab="${id}" onclick="goTo('${id}')">${esc(label)}</button>`
  ).join("");
}

function goTo(screen, silent=false) {
  if (!screen || state.current === screen) return;
  if (!silent && state.current) state.history.push(state.current);
  state.current = screen;

  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  byId("screen-" + screen)?.classList.add("active");
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === screen));
  byId("backBtn").classList.toggle("hidden", state.history.length === 0);

  renderCurrent();
}

function goBack() {
  const last = state.history.pop();
  if (last) goTo(last, true);
  byId("backBtn").classList.toggle("hidden", state.history.length === 0);
}

async function refreshData(force=false) {
  if (!state.token || state.loading) return;
  state.loading = true;
  try {
    const r = await api({ action:"sync", token:state.token });
    if (!r.success) throw new Error(r.message || "Không cập nhật được dữ liệu");

    state.data.content = r.content || [];
    state.data.accounts = r.accounts || [];
    state.data.sentLogs = r.sentLogs || [];
    state.data.dashboard = r.dashboard || null;
    state.data.releaseNotes = r.releaseNotes || [];
    state.dataLoaded = true;

    renderCurrent();
  } catch(e) {
    alert("Lỗi cập nhật dữ liệu: " + e.message);
  } finally {
    state.loading = false;
  }
}

async function loadUserAdmin(force=false) {
  if ((state.userAdminLoaded && !force) || state.roleKind !== "admin") return;
  state.userAdminError = "";
  try {
    const r = await api({ action:"get_user_admin_data", token:state.token });
    if (!r.success) throw new Error(r.message || "Không tải được danh sách tài khoản");
    state.data.users = r.users || [];
    state.data.credentials = r.credentials || [];
    state.userAdminLoaded = true;
  } catch(e) {
    state.userAdminError = e.message;
    state.data.users = [];
    state.data.credentials = [];
    state.userAdminLoaded = false;
    console.warn("Không tải được danh sách tài khoản:", e.message);
  }
}

async function renderCurrent() {
  if (state.current === "home") renderHome();
  if (state.current === "library") renderLibrary();
  if (state.current === "pricebook") renderPricebook();
if (state.current === "quote") renderQuote();
  if (state.current === "create") renderCreate();
  if (state.current === "accounts") renderAccounts();
  if (state.current === "sent") renderSent();
  if (state.current === "activity") renderActivity();
  if (state.current === "users") {
    await loadUserAdmin();
    renderUsers();
  }
}

function contentPack(c) {
  const id = String(c.ContentID || "").toLowerCase();
  const title = String(c.Title || "").toLowerCase();
  const t = String(c.ContentType || "").toLowerCase();
  const p = String(c.PortalType || "").toLowerCase();
  const tags = String(c.Tags || "").toLowerCase();
  const offer = String(c.OfferID || "").toLowerCase();
  const category = String(c.Category || "").toLowerCase();

  const all = [id, title, t, p, tags, offer, category].join(" ");

  if (all.includes("demo")) return "demo";
  if (all.includes("quote") || all.includes("báo giá") || all.includes("bảng giá")) return "quote";

  if (
    all.includes("franchise") ||
    all.includes("nhượng quyền") ||
    all.includes("chuyển giao")
  ) return "partner";

  if (
    all.includes("lab") ||
    all.includes("bid") ||
    all.includes("project") ||
    all.includes("contractor") ||
    all.includes("experience") ||
    all.includes("playgrow") ||
    all.includes("khu trải nghiệm") ||
    all.includes("phòng lab") ||
    all.includes("nhà thầu")
  ) return "project";

  if (
    all.includes("camp") ||
    all.includes("chủ đề") ||
    all.includes("material") ||
    all.includes("học cụ") ||
    all.includes("học liệu")
  ) return "school";

  if (
    all.includes("school") ||
    all.includes("trường")
  ) return "school";

  if (
    all.includes("partner") ||
    all.includes("đối tác") ||
    all.includes("referral") ||
    all.includes("giới thiệu")
  ) return "partner";

  return "intro";
}

  const selected = byId("libraryPack")?.value || "";
  const body = byId("libraryBody");
  if (!body) return;

  let packs = docPacks()
    .filter(p => !selected || p.id === selected)
    .map(p => {
      const docs = state.data.content
        .filter(c => contentPack(c) === p.id)
        .filter(c => !q || Object.values(c).join(" ").toLowerCase().includes(q));
      return { ...p, docs };
    });

  // Khi đang xem "Tất cả bộ tài liệu", chỉ hiện các bộ có tài liệu.
  // Việc này tránh giao diện có nhiều khối trống khi tài khoản chỉ được cấp một số tài liệu.
  if (!selected) {
    packs = packs.filter(p => p.docs.length > 0);
  }

  if (!packs.length) {
    body.innerHTML = `<div class="empty">Tài khoản hiện tại chưa có tài liệu phù hợp hoặc chưa được cấp quyền xem nhóm tài liệu này.</div>`;
    return;
  }

  body.innerHTML = packs.map(renderPack).join("");
}

async function createAccount() {
  const account = {
    AccountName: byId("accName").value.trim(),
    AccountType: byId("accType").value,
    Region: byId("accRegion").value.trim(),
    LeadSource: state.roleKind === "referral" ? `Giới thiệu bởi ${state.user.FullName || state.user.Username}` : state.roleKind === "project" ? "Nhà thầu/dự án" : "Nội bộ",
    PotentialLevel: byId("accPotential").value,
    Stage: state.roleKind === "project" ? "Đã hỏi thông tin" : "Lead mới",
    Status: "Active",
    Notes: byId("accNotes").value.trim()
  };

  if (!account.AccountName) {
    setMsg("createMsg", "Cần nhập tên đơn vị/người cần giới thiệu.", "error");
    return;
  }

  setMsg("createMsg", "Đang ghi nhận...", "");
  try {
    const r = await api({ action:"create_account", token:state.token, account });
    if (!r.success) throw new Error(r.message);
    state.data.accounts.push(r.account);
    setMsg("createMsg", "Đã ghi nhận: " + r.account.AccountID, "ok");
    byId("accName").value = ""; byId("accRegion").value = ""; byId("accNotes").value = "";
  } catch(e) {
    setMsg("createMsg", e.message, "error");
  }
}

async function createUser() {
  const permission = byId("newPermission").value;
  const roleMap = {
    STAFF_INTERNAL:"Staff_Internal",
    SALES_INTERNAL:"Sales_Internal",
    REFERRAL_PARTNER:"Referral_Partner",
    CONTRACTOR_EXPERIENCE:"Contractor",
    CONTRACTOR_LAB:"Contractor",
    INVESTOR_REFERRAL:"Investor",
    BOARD_STRATEGIC:"Board",
    CEO_FULL:"CEO"
  };
  const user = {
    FullName: byId("newFullName").value.trim(),
    Username: byId("newUsername").value.trim(),
    password: byId("newPassword").value.trim(),
    Role: roleMap[permission] || "Partner",
    PermissionGroupID: permission,
    Team: byId("newTeam").value.trim(),
    UserType: "User",
    Notes: byId("newNotes").value.trim(),
    Status: "Active"
  };
  if (!user.FullName || !user.Username || !user.password) {
    setMsg("userMsg", "Cần nhập đủ Họ tên, Email/ID và Mã PIN.", "error");
    return;
  }
  setMsg("userMsg", "Đang tạo tài khoản...", "");
  try {
    const r = await api({ action:"create_user_managed", token:state.token, user });
    if (!r.success) throw new Error(r.message);
    setMsg("userMsg", "Đã tạo tài khoản: " + r.user.Username, "ok");
    state.userAdminLoaded = false;
    await loadUserAdmin();
    renderUsers();
  } catch(e) {
    setMsg("userMsg", e.message, "error");
  }
}

async function updateUserStatus(userId, status) {
  try {
    const r = await api({ action:"update_user_status", token:state.token, UserID:userId, Status:status });

function quoteComponentLabel(type) {
  const t = String(type || '').toLowerCase();
  if (t.includes('hardware')) return 'Thiết bị & học cụ robot';
  if (t.includes('digital')) return 'Hệ bài học số & nhiệm vụ';
  if (t.includes('service')) return 'Dịch vụ triển khai & đào tạo';
  if (t.includes('creative')) return 'Hoạt động sáng tạo';
  if (t.includes('project')) return 'Hoạt động dự án';
  if (t.includes('display')) return 'Thiết bị hiển thị tùy chọn';
  if (t.includes('audit') || t.includes('quality')) return 'Đảm bảo chất lượng';
  return type || 'Cấu phần triển khai';
}
function uniqueJoin(arr, sep) {
  const seen = {}, out = [];
  (arr || []).forEach(x => {
    const v = String(x || '').trim();
    if (!v || seen[v]) return;
    seen[v] = true;
    out.push(v);
  });
  return out.join(sep || '; ');
}
function getComponentPrice(c) {
  return quoteNumber(c.TotalPrice || c.ComponentTotalPrice || c.ProposedSellingPrice || c.ComponentPrice || c.Price || c.ClientPrice || c.SellingPrice || c['Giá bán đề xuất'] || c['Giá cấu phần'] || c['Giá'] || 0);
}
function componentPriceText(c) {
  const p = getComponentPrice(c);
  return p ? quoteMoney(p) : 'Bao gồm trong gói';
}
function compactCustomerComponents(q) {
  const components = q.ComponentLines || [];
  const grouped = {};
  components.forEach(c => {
    const key = quoteComponentLabel(c.ComponentType || c.ProductName || 'Khác');
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(c);
  });
  const rows = Object.keys(grouped).map(group => {
    const items = grouped[group];
    const total = items.reduce((s, c) => s + getComponentPrice(c), 0);
    return {
      group,
      scope: uniqueJoin(items.map(c => c.ComponentName).filter(Boolean), '; '),
      description: uniqueJoin(items.map(c => c.Description).filter(Boolean), ' '),
      price: total,
      priceText: total ? quoteMoney(total) : 'Bao gồm trong gói',
      note: uniqueJoin(items.map(c => c.Note).filter(Boolean), ' ')
    };
  });
  if (!rows.length) rows.push({ group:'Cấu hình chương trình', scope:'Cấu hình theo Pricebook Master', description:'Chưa có cấu phần chi tiết từ COMPONENT_MASTER.', price:0, priceText:'Theo gói', note:'Cần kiểm tra mapping ProductID trong sheet dữ liệu.' });
  return rows;
}

function formatQuoteText(q) {
  const s=q.Summary||{}, lines=q.Lines||[], components=compactCustomerComponents(q), exclusions=getQuoteExclusions(q);
  return ['BÁO GIÁ PREVIEW SUNBOT','Mã báo giá: '+(q.QuoteID||''),'Ngày báo giá: '+(q.QuotedDate||quoteDateVN()),'Đơn vị báo giá: '+(q.QuotedBy||getQuoteIssuerLine()),'Bên được báo giá: '+(q.ClientName||''),'Người liên hệ: '+(q.ContactName||''),'Khu vực: '+(q.Region||''),'Gói: '+(q.PackageName||q.PackageID||''),'Loại khách: '+(q.ClientType||''),'Số năm: '+(q.Years||''),'Số lượng: '+(q.Quantity||''),'','CẤU HÌNH CUNG CẤP:',...components.map(c=>'- '+(c.group||'')+': '+(c.scope||'')+(c.description?' — '+c.description:'')+' | Giá: '+(c.priceText||'Bao gồm trong gói')),'','CHI TIẾT GIÁ:',...lines.map(l=>'- '+(l.Name||'')+': '+quoteMoney(l.Total||0)),'','TỔNG NĂM 1: '+quoteMoney(s.Year1||0),'TỔNG NĂM 2: '+quoteMoney(s.Year2||0),'TỔNG NĂM 3: '+quoteMoney(s.Year3||0),'TỔNG CỘNG: '+quoteMoney(s.GrandTotal||0),'','CHƯA BAO GỒM:',...exclusions.map(x=>'- '+x),'','Ghi chú: Báo giá preview, chưa phải báo giá chính thức có ký duyệt.'].join('\n');
}
function copyQuoteText(){const text=byId('quoteCopyText')?.value||''; copyText(text);}

async function logQuoteEvent(eventType, extra={}) {
  const q = window.__lastSunbotQuote;
  if (!q) return;
  try {
    await api({ action:'log_quote_event', token:state.token, eventType, quote:{...q, ...extra} });
  } catch(e) {
    console.warn('Không ghi được QUOTE_LOG:', e.message);
  }
}

async function saveQuoteDeal() {
  const q = window.__lastSunbotQuote;
  if (!q) { alert('Chưa có báo giá để lưu.'); return; }
  if (!q.ClientName) { alert('Cần nhập tên bên được báo giá trước khi lưu vào theo dõi.'); return; }
  setMsg('quoteActionMsg','Đang lưu vào theo dõi...','');
  const account = {
    AccountName: q.ClientName,
    AccountType: q.ClientType || 'Khách báo giá',
    Region: q.Region || '',
    LeadSource: 'Quote Generator / Growth OS',
    PotentialLevel: 'B',
    Stage: 'Đang báo giá',
    Status: 'Active',
    Notes: [`Mã báo giá: ${q.QuoteID || ''}`, `Gói: ${q.PackageName || q.PackageID || ''}`, `Tổng: ${quoteMoney(q.Summary?.GrandTotal || 0)}`, q.ContactName ? `Người liên hệ: ${q.ContactName}` : '', q.QuoteNote || ''].filter(Boolean).join('\n')
  };
  try {
    const r = await api({ action:'create_account', token:state.token, account });
    if (!r.success) throw new Error(r.message || 'Không lưu được khách/cơ hội.');
    if (r.account) state.data.accounts.push(r.account);
    q.AccountID = r.account?.AccountID || '';
    await logQuoteEvent('SAVE_DEAL', { AccountID:q.AccountID });
    setMsg('quoteActionMsg','Đã lưu vào theo dõi: '+(q.AccountID || q.ClientName),'ok');
  } catch(e) {
    setMsg('quoteActionMsg', e.message, 'error');
  }
}

async function exportQuotePDF() {
  const q = window.__lastSunbotQuote;
  if (!q) { alert('Chưa có báo giá để xuất PDF.'); return; }
  await logQuoteEvent('PDF_EXPORT');
  const w = window.open('', '_blank');
  if (!w) { alert('Trình duyệt đang chặn popup. Hãy cho phép popup để xuất PDF.'); return; }
  w.document.open();
  w.document.write(buildQuotePDFHTML(q));
  w.document.close();
  setTimeout(()=>{w.focus();w.print();},500);
}

Á SUNBOT</h1><div class="muted">Hệ học tập công nghệ sáng tạo lấy robot làm trung tâm</div></div></div><div style="text-align:right"><div><b>Mã:</b> ${esc(q.QuoteID||'')}</div><div><b>Ngày báo giá:</b> ${esc(q.QuotedDate||quoteDateVN())}</div><div><b>Bên được báo giá:</b> ${esc(q.ClientName||'')}</div><div><b>Người liên hệ:</b> ${esc(q.ContactName||'')}</div><div><b>Gói:</b> ${esc(q.PackageName||q.PackageID||'')}</div><div><b>Người báo giá:</b> ${esc(q.QuotedBy || getQuoteIssuerLine())}</div></div></div><div class="recipient"><div class="recipient-grid"><div><b>Kính gửi:</b> ${esc(recipientLine)}</div><div><b>Ngày báo giá:</b> ${esc(q.QuotedDate||quoteDateVN())}</div><div><b>Người liên hệ:</b> ${esc(q.ContactName||"")}</div><div><b>Khu vực:</b> ${esc(q.Region||"")}</div><div><b>Đơn vị báo giá:</b> ${esc(q.QuotedBy || getQuoteIssuerLine())}</div><div><b>Mã báo giá:</b> ${esc(q.QuoteID||"")}</div></div><p><b>${esc(subjectLine)}</b></p><p>${esc(introLine)}</p></div><div class="note"><b>Lưu ý:</b> Đây là báo giá preview phục vụ trao đổi ban đầu. Báo giá chính thức cần được Kiro/Sunbot xác nhận trước khi gửi khách hàng hoặc đưa vào hợp đồng.</div><div class="summary"><div class="box"><div class="label">Năm 1</div><div class="value">${quoteMoney(s.Year1)}</div></div><div class="box"><div class="label">Năm 2</div><div class="value">${quoteMoney(s.Year2)}</div></div><div class="box"><div class="label">Năm 3</div><div class="value">${quoteMoney(s.Year3)}</div></div><div class="box"><div class="label">Tổng cộng</div><div class="value">${quoteMoney(s.GrandTotal)}</div></div></div><h2>1. Cấu hình cung cấp</h2><table><thead><tr><th>Nhóm cấu hình</th><th>Nội dung cung cấp</th><th>Ý nghĩa triển khai</th><th>Giá cấu phần</th></tr></thead><tbody>${componentRows}</tbody></table><h2>2. Chi tiết giá theo nhóm</h2><table><thead><tr><th>Nhóm</th><th>Hạng mục</th><th>SL</th><th>Năm 1</th><th>Năm 2</th><th>Năm 3</th><th>Tổng</th></tr></thead><tbody>${lineRows}</tbody></table><h2>3. Chưa bao gồm</h2><ul>${exclusions.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><h2>4. Điều kiện và ghi chú</h2><ul>${terms.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul><div class="footer">Sunbot/Kiro Việt Nam · Báo giá preview từ Sunbot Growth OS · Không hiển thị giá vốn, margin hoặc giả định nội bộ.</div></body></html>`;
}


if (state.token && state.user) {
